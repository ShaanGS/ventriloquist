[project]
name = "ventriloquist"
version = "0.1.0"
description = "Compile any Mac app into an MCP server: explore once, get typed tools backed by deterministic accessibility replay."
requires-python = ">=3.11"
dependencies = [
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "click>=8.1",
    "mcp>=2.0,<3",
    "anyio>=4.0",
]

[project.scripts]
vent = "vent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vent"]
