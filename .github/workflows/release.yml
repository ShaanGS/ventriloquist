name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Actions are pinned to full commit SHAs, with the release tag in a comment,
# so a moved tag can't change what runs here, least of all in the job that
# publishes to PyPI. Dependabot keeps them current.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import pathlib, re; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('vent/__init__.py').read_text()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: python -m pip install --upgrade build
      - run: python -m build

      # Test what is about to be published, not the checkout: the built wheel
      # in a clean environment. Nothing below runs unless these pass, so a
      # broken wheel never reaches PyPI.
      - name: Install the built wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/env"
          "$RUNNER_TEMP/env/bin/pip" install dist/*.whl pytest
      - name: Serve the bundled packs from the installed wheel
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/env/bin/python" "$GITHUB_WORKSPACE/tests/install_smoke.py" "$RUNNER_TEMP/env/bin"'
      - name: Copy the tests to a folder with no vent source in it
        run: |
          cp -R "$GITHUB_WORKSPACE" "$RUNNER_TEMP/check"
          rm -rf "$RUNNER_TEMP/check/vent"
      - name: Check vent is imported from the wheel
        working-directory: ${{ runner.temp }}/check
        run: |
          "$RUNNER_TEMP/env/bin/python" -c 'import sys, vent; print(vent.__file__); sys.exit("/site-packages/" not in vent.__file__)'
      - name: Check the release metadata the MCP registry reads
        working-directory: ${{ runner.temp }}/check
        run: '"$RUNNER_TEMP/env/bin/python" -m pytest -q -p no:cacheprovider tests/test_release.py'
      - name: Run the offline test suite against the wheel
        working-directory: ${{ runner.temp }}/check
        run: '"$RUNNER_TEMP/env/bin/python" -m pytest -q -p no:cacheprovider tests/'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ventriloquist-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
