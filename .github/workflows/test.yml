name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install -e . pytest
      - run: .venv/bin/python -m pytest tests/ -q
